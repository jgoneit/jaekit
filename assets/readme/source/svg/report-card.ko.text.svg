<title id="title">완료 보고</title>
<desc id="description">password-link의 가상 완료 보고. ha report 출력 모양입니다. 다섯 줄 요약: 바뀐 것, 확인한 것, 직접 볼 것, 남은 한계(보증 수준 local; 검사 작성자: 실행자), 다음 행동. 그 아래 완료 기록 seq 6의 조건별 근거: AC-1 change는 근거 기록 2, 3, AC-2 maintain은 4. 실제 기록이 아닌 가상 예시입니다.</desc>
