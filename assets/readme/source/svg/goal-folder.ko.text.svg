<title id="title">폴더 구조</title>
<desc id="description">가상 목표 폴더 docs/specs/password-link/: Spec이 SPEC.md를, Seal이 PLAN.md·REVIEW.md·PROGRESS.md를, ha가 runs.jsonl을 씁니다. REVIEW.md는 검토 계획과 Spar 기록의 요약·위치를 담습니다. Spar의 검토 라운드(01-candidate/)와 gate(gate.json)는 프로젝트의 Git이 무시하게 설정한 docs/reviews/password-link/에(.gitignore에 docs/reviews/ 추가), 검사 출력 원문은 .git/ha/에 남고 Git이 추적하지 않습니다. 실제 기록이 아닌 가상 예시입니다.</desc>
