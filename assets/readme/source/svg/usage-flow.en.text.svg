<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">One task, from request to review.</title>
<desc id="description">1. Describe your request to Spec, then review the goal and completion criteria. 2. Start Seal separately by specifying the goal folder in a new message. The agent builds, checks, fixes, and records progress. 3. Read the changes and check records, and review the result against the goal. To resume in a new conversation, open the same project and name the same goal. This is a concept illustration, not an actual execution result.</desc>
