<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description" xml:lang="ko">
<title id="title">한 번의 작업, 이렇게 진행됩니다.</title>
<desc id="description">1. Spec에 요청하면 목표와 완료 조건, 검토 등급(Assurance)을 정리하고 지금 구현할지 묻습니다. 내가 읽고 확인합니다. 2. “응”이라고 답하면 Seal이 시작됩니다. 나중에 별도 메시지로 목표 폴더를 지정해 시작해도 됩니다. 3. 에이전트가 계획·구현하고 ha로 검사하며, 모든 실행이 기록됩니다. standard·strict 목표는 완료 전에 Spar의 독립 검토 라운드를 받고 strict는 작업 전 계획 검토도 받습니다. light는 이유를 남기고 검토를 생략할 수 있습니다. 요구를 바꿔야 하는 질문은 내게 옵니다. 4. 필수 조건이 충족되고, standard·strict는 기록된 검토 gate가 마지막 commit을 덮으면 ha done이 완료를 기록합니다. 완료 보고는 PROGRESS.md에 남습니다. 새 대화에서는 같은 프로젝트의 같은 목표를 지정해 이어갑니다. 실제 실행 결과가 아닌 개념도입니다.</desc>
