<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Goal folder</title>
<desc id="description">Fictional goal folder docs/specs/password-link/: Spec writes SPEC.md; Seal writes PLAN.md, REVIEW.md and PROGRESS.md; ha writes runs.jsonl. REVIEW.md holds the review plan and summarizes and points to the Spar records. Spar&#x27;s review rounds (01-candidate/) and gate (gate.json) stay in docs/reviews/password-link/, a folder the project&#x27;s Git is set up to ignore (add docs/reviews/ to .gitignore), and raw check output stays in .git/ha/, which Git does not track. A fictional example, not a real record.</desc>
