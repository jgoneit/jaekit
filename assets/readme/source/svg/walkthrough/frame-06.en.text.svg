<title id="title">Jaekit walkthrough, frame 6: Spar review</title>
<desc id="description">Frame 6 of 9, Spar review: $ spar run --stage candidate --base f46020c \     --criteria docs/specs/password-link/SPEC.md \     --check-path &#x27;checks/**&#x27; \     --out docs/reviews/password-link/01-candidate spar: round written to docs/reviews/password-link/01-candidate 01-candidate/summary.md - claude: completed, 0 findings (verified isolation, required, …) - codex: completed, 0 findings (verified isolation, required, …) — Spar review round. Independent reviewers read the same packet: goal documents, checks and diff. A finding is fixed, or comes to you as a question. Spar does not certify or deploy. Fictional example; not a recording of a real run.</desc>
