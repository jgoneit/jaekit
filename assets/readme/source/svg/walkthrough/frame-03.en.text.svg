<title id="title">Jaekit walkthrough, frame 3: You start Seal</title>
<desc id="description">Frame 3 of 5, You start Seal: Spec: Implement docs/specs/password-link now? Assurance: standard. Yes Seal: starting docs/specs/password-link Or start it later, in a separate message: /seal:seal docs/specs/password-link — You start Seal. Answer “Yes” to Spec&#x27;s question, or call Seal in a separate message later. Either way, the agent takes the goal from here. Fictional example; not a recording of a real run.</desc>
