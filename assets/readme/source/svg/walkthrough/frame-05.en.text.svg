<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Jaekit walkthrough, frame 5: Check</title>
<desc id="description">Frame 5 of 9, Check: Before the change, on the starting commit: $ ha check docs/specs/password-link --baseline AC-1 AC-1 baseline fail_as_expected (seq 2) After the change is committed: $ ha check docs/specs/password-link AC-1 AC-2 AC-1 check pass (seq 3) classification: targets_passed AC-2 check pass (seq 4) — …and after it. After the change, AC-1 passes and AC-2 still passes. Only runs ha records count. Fictional example; not a recording of a real run.</desc>
