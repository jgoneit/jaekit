<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Jaekit walkthrough, frame 4: The agent works</title>
<desc id="description">Frame 4 of 5, The agent works: $ ha check docs/specs/password-link --baseline AC-1 AC-1 baseline fail_as_expected (seq 2) before the change $ ha check docs/specs/password-link AC-1 AC-2 AC-1 check pass (seq 3) after the change AC-2 check pass (seq 4) still passes $ spar run --stage candidate --base f46020c … Spar review round $ spar gate docs/reviews/password-link/01-candidate … $ ha note docs/specs/password-link review --gate … noted: review (seq 5) gate recorded $ ha done docs/specs/password-link - status: **complete** (exit 0) - completion record: seq 6 completion recorded — The agent works. You do not type these commands. The agent runs them while you wait; ha records each run. Spar reviewers read the goal, checks and diff. Spar does not certify or deploy. Fictional example; not a recording of a real run.</desc>
