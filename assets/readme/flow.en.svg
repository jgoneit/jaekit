<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1032" viewBox="0 0 400 1032" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">From request to a result</title>
  <desc id="desc">Five stages: request, Spec defines the goal and stops, you review and separately ask to start, Seal repeats implementation checks and fixes, then reports completion for you to review. Answer questions affecting the result and resume the same goal after a conversation ends.</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; } .label { font-size: 14px; font-weight: 700; letter-spacing: .3px; } .heading { font-size: 20px; font-weight: 700; fill: #172b4d; } .body { font-size: 18px; fill: #31435b; }</style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#6f849e" stroke-width="1.5"/></marker></defs>
  <rect width="400" height="1032" rx="18" fill="#f6f8fc"/>
  <text x="24" y="43" font-size="27" font-weight="750" fill="#172b4d">From request to a result</text>
  <text x="24" y="73" font-size="15" fill="#52657e">Define the goal with Spec. Run it with Seal.</text>
  <rect x="24" y="100" width="352" height="138" rx="14" fill="#ffffff" stroke="#cad5e2"/>
  <circle cx="46" cy="125" r="11" fill="#3e5e89"/>
  <text x="46" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text class="label" x="65" y="130" fill="#3e5e89">YOU</text>
  <text class="heading" x="44" y="162">Describe what you need</text>
  <text class="body" x="44" y="191">Tell your agent what you want</text>
  <text class="body" x="44" y="215">to change or create.</text>
  <path d="M200 245 V260" stroke="#6f849e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="24" y="266" width="352" height="138" rx="14" fill="#edf5ff" stroke="#cad5e2"/>
  <circle cx="46" cy="291" r="11" fill="#295fa7"/>
  <text x="46" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text class="label" x="65" y="296" fill="#295fa7">SPEC · DEFINE THE GOAL</text>
  <text class="heading" x="44" y="328">Write the goal, then stop</text>
  <text class="body" x="44" y="357">Spec defines the desired result</text>
  <text class="body" x="44" y="381">and the conditions for completion.</text>
  <path d="M200 411 V426" stroke="#6f849e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="24" y="432" width="352" height="138" rx="14" fill="#ffffff" stroke="#cad5e2"/>
  <circle cx="46" cy="457" r="11" fill="#3e5e89"/>
  <text x="46" y="461" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text class="label" x="65" y="462" fill="#3e5e89">YOU</text>
  <text class="heading" x="44" y="494">Review, then ask to start</text>
  <text class="body" x="44" y="523">Read the goal and ask for changes.</text>
  <text class="body" x="44" y="547">Then ask separately to implement it.</text>
  <path d="M200 577 V592" stroke="#6f849e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="24" y="598" width="352" height="138" rx="14" fill="#eaf7f4" stroke="#cad5e2"/>
  <circle cx="46" cy="623" r="11" fill="#17715f"/>
  <text x="46" y="627" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text class="label" x="65" y="628" fill="#17715f">SEAL · DO THE WORK</text>
  <text class="heading" x="44" y="660">Implement → check → fix</text>
  <text class="body" x="44" y="689">Repeat until required conditions</text>
  <text class="body" x="44" y="713">are met. No approval for each task.</text>
  <path d="M200 743 V758" stroke="#6f849e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="24" y="764" width="352" height="138" rx="14" fill="#eaf7f4" stroke="#cad5e2"/>
  <circle cx="46" cy="789" r="11" fill="#17715f"/>
  <text x="46" y="793" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
  <text class="label" x="65" y="794" fill="#17715f">SEAL → YOU</text>
  <text class="heading" x="44" y="826">Read the report. Try the result.</text>
  <text class="body" x="44" y="855">Get the result and what was checked.</text>
  <text class="body" x="44" y="879">Review the result for yourself.</text>
  <text x="24" y="944" font-size="17" font-weight="700" fill="#172b4d">Keep the work moving</text>
  <text x="24" y="975" font-size="16" fill="#31435b">Answer questions that affect the result.</text>
  <text x="24" y="999" font-size="16" fill="#31435b">Resume the same goal in a new chat.</text>
</svg>
