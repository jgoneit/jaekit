<svg xmlns="http://www.w3.org/2000/svg" width="400" height="642" viewBox="0 0 400 642" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Fictional example · Login</title>
  <desc id="desc">Two fictional login screens. Before: email and password fields and a login button. The intended after state keeps those elements and adds a Forgot password link. These are not app screenshots or test results.</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; }</style>
  <rect width="400" height="642" rx="18" fill="#f6f8fc"/>
  <text x="24" y="38" font-size="24" font-weight="700" fill="#172b4d">Fictional example · Login</text>
  <text x="24" y="66" font-size="16" fill="#52657e">Keep login working. Add a recovery link.</text>
  <rect x="24" y="90" width="352" height="226" rx="14" fill="#ffffff" stroke="#cad5e2"/>
  <text x="44" y="120" font-size="14" font-weight="700" fill="#3e5e89">BEFORE</text>
  <rect x="44" y="136" width="312" height="38" rx="6" fill="#f6f8fc" stroke="#cad5e2"/>
  <text x="57" y="161" font-size="17" fill="#52657e">Email</text>
  <rect x="44" y="184" width="312" height="38" rx="6" fill="#f6f8fc" stroke="#cad5e2"/>
  <text x="57" y="209" font-size="17" fill="#52657e">Password</text>
  <rect x="44" y="234" width="312" height="38" rx="6" fill="#295fa7"/>
  <text x="200" y="259" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Log in</text>
  <rect x="24" y="342" width="352" height="226" rx="14" fill="#ffffff" stroke="#cad5e2"/>
  <text x="44" y="372" font-size="14" font-weight="700" fill="#3e5e89">AFTER · INTENDED RESULT</text>
  <rect x="44" y="388" width="312" height="38" rx="6" fill="#f6f8fc" stroke="#cad5e2"/>
  <text x="57" y="413" font-size="17" fill="#52657e">Email</text>
  <rect x="44" y="436" width="312" height="38" rx="6" fill="#f6f8fc" stroke="#cad5e2"/>
  <text x="57" y="461" font-size="17" fill="#52657e">Password</text>
  <rect x="44" y="486" width="312" height="38" rx="6" fill="#295fa7"/>
  <text x="200" y="511" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Log in</text>
  <text x="200" y="552" text-anchor="middle" font-size="17" text-decoration="underline" fill="#295fa7">Forgot password?</text>
  <text x="200" y="613" text-anchor="middle" font-size="14" fill="#52657e">Workflow illustration · Not an executed result</text>
</svg>
