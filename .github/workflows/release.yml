name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check public files
        run: |
          python3 tools/check_public_tree.py
          python3 tools/check_public_docs.py

      - name: Test
        run: |
          go test ./...
          python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Build release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "tools/release/notes/${TAG}.md"
          version="${TAG#v}"
          # Outside the checkout, so the build info shows a clean tree.
          build="${RUNNER_TEMP}/build"
          dist="${RUNNER_TEMP}/dist"
          test ! -e "${build}"
          test ! -e "${dist}"
          mkdir "${build}" "${dist}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="ha_${version}_${os}_${arch}"
            mkdir -p "${build}/${name}"
            GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "${build}/${name}/ha" ./cmd/ha
            cp LICENSE README.md README.en.md "${build}/${name}/"
            cp -R guides contracts assets "${build}/${name}/"
            mkdir -p "${build}/${name}/tools" "${build}/${name}/examples/check-result"
            cp tools/check-result-reference.py "${build}/${name}/tools/"
            for example in README.md declaration.json reference.json input.txt; do
              cp "examples/check-result/${example}" "${build}/${name}/examples/check-result/"
            done
            tar -C "${build}" -czf "${dist}/${name}.tar.gz" "${name}"
          done
          (cd "${dist}" && sha256sum -- *.tar.gz > checksums.txt)

      - name: Verify archives and native smoke
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release/check_archives.py \
            --version "${TAG#v}" --dist "${RUNNER_TEMP}/dist" --run-native

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # create refuses an existing release; never delete assets or use --clobber.
          gh release create "${TAG}" "${RUNNER_TEMP}"/dist/* \
            --verify-tag \
            --title "jaekit ${TAG}" \
            --notes-file "tools/release/notes/${TAG}.md"
          gh release view "${TAG}" --json assets --jq '.assets[].name' > "${RUNNER_TEMP}/published-assets.txt"
          python3 tools/release/check_archives.py \
            --version "${TAG#v}" --dist "${RUNNER_TEMP}/dist" \
            --published-assets "${RUNNER_TEMP}/published-assets.txt"
