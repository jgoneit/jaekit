name: 사용 보고 / Usage report
description: Jaekit에 맡긴 작업과 결과를 알려 주세요. / Tell us what you handed to Jaekit and how it went.
title: "[사용 보고 / Usage] "
body:
  - type: markdown
    attributes:
      value: |
        **이 issue는 공개됩니다. / This issue is public.**

        한국어 또는 영어로 작성해 주세요. 환경과 버전은 아는 것만 적어도 됩니다.
        Write in Korean or English. Share environment and version details only if you know them.

        비공개 목표 문서나 대화·실행 기록 전체 대신 공개 가능한 요약을 적어 주세요.
        Share a public summary instead of private goal documents or full conversation and execution records.
  - type: textarea
    id: task
    attributes:
      label: 맡긴 작업 / Task you handed over
      description: >-
        공개해도 되는 요약으로 적어 주세요. 예: "웹 앱의 로그인 화면에 비밀번호 찾기 링크 추가, 완료 조건 5개" /
        A summary you can share publicly, e.g. "Add a forgot-password link to a web app's login screen, 5 criteria"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 결과 / Result
      options:
        - 완료 / Complete
        - 추가 질문을 받음 / Asked for more input
        - 문제로 진행하지 못함 / Could not proceed
        - 예산 소진 / Budget exhausted
        - 중간에 멈춤 / Stopped partway
        - 아직 진행 중 / Still in progress
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 사용하면서 어땠나요? / How did it go?
      description: 좋았던 점, 어려웠던 점, 예상과 달랐던 점을 자유롭게 적어 주세요. / Tell us what worked, what was difficult, or what surprised you.
  - type: dropdown
    id: component
    attributes:
      label: 사용한 기능 / Parts used
      multiple: true
      options:
        - Spec
        - Seal
        - ha CLI
        - 잘 모르겠어요 / Not sure
  - type: textarea
    id: environment
    attributes:
      label: 사용 환경 / Environment
      description: 사용한 앱과 운영체제, 버전을 아는 만큼 적어 주세요. / Share the app, OS, and versions you know.
      placeholder: Codex 앱 / Codex CLI / Claude Code, macOS / Linux / Windows
  - type: input
    id: ha-version
    attributes:
      label: ha 버전 / ha version
      description: "ha를 설치했다면 `ha --version`으로 확인할 수 있습니다. Spec만 사용했다면 비워 두세요. / If ha is installed, check with `ha --version`. Leave blank if you only used Spec."
      placeholder: ha 0.1.3
